<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 250px; padding: 15px; font-family: sans-serif; line-height: 1.6; }
    .section { margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; }
    input[type="range"] { width: 100%; }
    input[type="text"] { width: 100%; padding: 5px; box-sizing: border-box; }
    button { width: 100%; padding: 8px; margin-top: 5px; cursor: pointer; }
    .rate-val { color: #d93025; font-size: 1.2em; }
  </style>
</head>
<body>
  <div class="section">
    <label><input type="checkbox" id="isEnabled" checked> 자막 읽기 활성화</label>
  </div>
  <div class="section">
    <label>읽기 속도: <span id="rateLabel" class="rate-val">1.0</span>x</label>
    <input type="range" id="voiceRate" min="0.5" max="4.0" step="0.1" value="1.0">
  </div>
  <div class="section">
    <label>속도 조절 테스트</label>
    <input type="text" id="testText" value="안녕하세요. 속도 테스트 중입니다.">
    <button id="testBtn">테스트 음성 듣기</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
